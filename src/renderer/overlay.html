<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HT Subtitle Overlay</title>
  <style>
    /* 彻底消除 Windows 透明窗口下的毛玻璃遮罩伪影 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    html, body {
      background: transparent !important;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .subtitle-hud {
      width: 100%;
      height: 100%;
      background: rgba(15, 16, 20, 0.95);
      border: 1px solid #27292e;
      border-radius: 10px;
      padding: 12px 18px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      -webkit-app-region: drag;
      cursor: move;
      color: #ededed;
      transition: border-color 0.15s ease;
    }

    .subtitle-hud:hover {
      border-color: #3f424b;
    }

    .hud-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }

    .hud-badge {
      font-size: 10px;
      font-weight: 600;
      color: #9496a1;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .btn-close {
      background: transparent;
      border: none;
      color: #71737d;
      cursor: pointer;
      font-size: 13px;
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      transition: all 0.15s;
      -webkit-app-region: no-drag;
    }

    .btn-close:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.1);
    }

    .hud-original {
      font-size: 12px;
      color: #8c8e98;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 2px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    .hud-translated {
      font-size: 16px;
      font-weight: 600;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .typing {
      display: inline-block;
      width: 2px;
      height: 14px;
      background: #a1a1aa;
      margin-left: 2px;
      vertical-align: middle;
      animation: blink 0.8s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 0; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="subtitle-hud" id="hud-box">
    <div class="hud-header">
      <span class="hud-badge">HT Live Subtitle</span>
      <button id="overlay-hide" class="btn-close" title="隐藏浮窗">✕</button>
    </div>
    <div class="hud-original" id="overlay-original">Waiting for speech stream...</div>
    <div class="hud-translated" id="overlay-translated">
      <span id="overlay-text">Harrio Translate 实时字幕就绪</span>
      <span class="typing"></span>
    </div>
  </div>

  <script src="js/overlay.js"></script>
</body>
</html>
