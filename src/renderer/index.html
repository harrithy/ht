<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HT (Harrio Translate)</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 自定义无边框顶栏 -->
  <header class="title-bar">
    <div class="brand">
      <span class="brand-badge">HT</span>
      <span>Harrio Translate 实时转译台</span>
    </div>
    <div class="window-controls">
      <button id="btn-minimize" class="btn-ctrl" title="最小化">—</button>
      <button id="btn-close" class="btn-ctrl btn-close" title="关闭">✕</button>
    </div>
  </header>

  <!-- 工作区容器 -->
  <div class="container">
    <!-- 侧边设置与控制 -->
    <aside class="sidebar">
      <span class="panel-title">流式配置 (Stream Setup)</span>
      
      <div class="control-group">
        <label class="control-label">源语言 (Source)</label>
        <select id="select-source-lang" class="select-control">
          <option value="auto">自动识别 (Auto)</option>
          <option value="en-US">英语 (English)</option>
          <option value="zh-CN">中文 (Mandarin)</option>
          <option value="ja-JP">日语 (Japanese)</option>
          <option value="ko-KR">韩语 (Korean)</option>
        </select>
      </div>

      <div class="control-group">
        <label class="control-label">目标语言 (Target)</label>
        <select id="select-target-lang" class="select-control">
          <option value="zh-CN">中文 (Mandarin)</option>
          <option value="en-US">英语 (English)</option>
          <option value="ja-JP">日语 (Japanese)</option>
          <option value="ko-KR">韩语 (Korean)</option>
        </select>
      </div>

      <div class="control-group">
        <label class="control-label">转译引擎 (Provider)</label>
        <select id="select-provider" class="select-control">
          <option value="mock">内置智能流式引擎 (Simulated)</option>
          <option value="deepseek">DeepSeek 实时大模型</option>
          <option value="openai">OpenAI GPT-4o-mini</option>
        </select>
      </div>

      <div class="control-group" id="api-key-group" style="display: none;">
        <label class="control-label">API 密钥 (Key)</label>
        <input type="password" id="input-api-key" class="input-control" placeholder="sk-..." />
      </div>

      <hr style="border: none; border-top: 1px solid var(--border-glass); margin: 4px 0;">

      <button id="btn-toggle-overlay" class="btn-secondary">
        🖥️ 切换同传悬浮字幕 (Ctrl+Shift+T)
      </button>

      <div style="flex: 1;"></div>

      <button id="btn-mic-toggle" class="btn-action">
        🎙️ 开启实时音频监听
      </button>
    </aside>

    <!-- 实时翻译双向看板 -->
    <main class="main-workspace">
      <!-- 原始音频转录流 -->
      <section class="stream-card">
        <div class="card-header">
          <div class="card-title">
            <span class="status-indicator" id="source-status"></span>
            原始语音 / 文本流 (Source Stream)
          </div>
          <span style="font-size: 11px; color: var(--text-muted);" id="source-latency">0 ms</span>
        </div>
        <div class="stream-content" id="source-content"></div>
      </section>

      <!-- 实时转译输出流 -->
      <section class="stream-card">
        <div class="card-header">
          <div class="card-title">
            <span class="status-indicator" style="background: var(--accent-cyan);"></span>
            实时翻译结果 (Harrio Stream Output)
          </div>
          <span style="font-size: 11px; color: var(--accent-mint);" id="target-latency">实时连线中</span>
        </div>
        <div class="stream-content" id="target-content"></div>
      </section>

      <!-- 快捷测试输入栏 -->
      <div class="input-box-container">
        <input type="text" id="manual-text-input" class="text-input-field" placeholder="输入要实时翻译的文本，按回车立即测试流式转译...">
        <button id="btn-send-text" class="btn-action" style="padding: 0 20px;">发送</button>
      </div>
    </main>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
